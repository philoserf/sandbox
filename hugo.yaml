baseURL: https://philoserf.github.io/sandbox/
locale: en-us
title: Ælfwine Wulfing
enableGitInfo: true
enableRobotsTXT: true
taxonomies: {} # intentionally empty to disable tags and categories

params:
  author: "Ælfwine Wulfing"
  since: 2005
  description: "Scort gied and sarig spræc ymbe wisdom and wræc, mid sang, run, and þa lytlan cræftas: fyr, tid, meduheall, and stæf."
  email: "wid@example.com"
  # Placeholder motto, Old English in place of site's Latin — home page,
  # About page, and the vCard NOTE field.
  motto: "ÞENC·LEORNA·BIND·CWEÐ"
  nickname: "widsith"
  # Warm-paper background hexes; must match --background-color in static/style.css
  themeColor:
    light: "#faf7f1"
    dark: "#201d18"

  home:
    headline: "Uncuþ gemynd on gemot"
    startHereIntro: "Gied þe secgaþ hwæt þa oþre fundiaþ to donne."
    featured:
      - pageRef: /posts/sae-deop-flan
      - pageRef: /posts/thurst-scip-haerfest-geong
    # Drawn from the older posts on purpose: index.html fills "Recent" with
    # the newest four that are not featured, so picking those here would
    # print the same four titles twice on the home page.
    startHere:
      - pageRef: /posts/theow-dysig-hring
      - pageRef: /posts/cuth-fyrn
      - pageRef: /posts/tear-hors-wif-aemtig
      - pageRef: /posts/staef-waeter-wif

  # Invented throughout: this repo publishes a vCard at /vcard.vcf, and a
  # public sandbox is no place for real contact details. The phone is in the
  # 555-01xx range reserved for fiction; the domain is RFC 2606's example.com.
  contact:
    givenName: "Ælfwine"
    familyName: "Wulfing"
    birthday: "09750427"
    phone: "+12025550137"
    timezone: "Europe/London"
    address:
      street: "12 Meduhealle Weg"
      city: "Heorot"
      region: "Westseaxe"
      postalCode: "XX0 0XX"
      country: "Engla Land"

  social:
    github: "https://example.com/widsith"
    mastodon: "https://example.com/@widsith"

menus:
  main:
    - name: Ymbe
      pageRef: /about
      weight: 10
      params:
        description: Hwa se writere is
    - name: Nu
      pageRef: /now
      weight: 20
      params:
        description: Þæt þe nu is on hand
    - name: Notu
      pageRef: /uses
      weight: 30
      params:
        description: Tol and geteoh
    - name: Gied
      pageRef: /posts
      weight: 40
      params:
        description: Ealra gieda tæl
        llmsSection: writing

mediaTypes:
  application/manifest+json:
    suffixes: [webmanifest]
  text/vcard:
    suffixes: [vcf]

outputFormats:
  llms:
    name: llms
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  manifest:
    name: manifest
    mediaType: application/manifest+json
    baseName: site
    isPlainText: true
    notAlternative: true
  vcard:
    name: vcard
    mediaType: text/vcard
    baseName: vcard
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - rss
    - llms
    - manifest
    - vcard
